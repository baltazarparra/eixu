name: Premium conversions

on:
  workflow_dispatch:
    inputs:
      conversion_id:
        description: Conversão específica pedida pelo painel
        required: false
        type: string
  schedule:
    # Cada agenda respeita o intervalo mínimo de cinco minutos do GitHub. Os
    # minutos intercalados reduzem a espera normal sem exigir token no painel.
    - cron: '1-59/5 * * * *'
    - cron: '3-59/5 * * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: premium-conversions
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    env:
      EIXU_URL: https://eixu.com.br
      GH_TOKEN: ${{ github.token }}
      PREMIUM_WORKER_TOKEN: ${{ secrets.PREMIUM_WORKER_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM: ${{ vars.VERCEL_TEAM || 'rvnn' }}
    steps:
      - name: Claim next conversion
        id: claim
        env:
          CONVERSION_ID: ${{ inputs.conversion_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output claim.json --write-out '%{http_code}' \
            --request POST \
            --header "authorization: Bearer ${PREMIUM_WORKER_TOKEN}" \
            --header 'content-type: application/json' \
            --data "$(jq --null-input --arg conversion "$CONVERSION_ID" \
              'if $conversion == "" then {} else {conversionId:$conversion} end')" \
            "${EIXU_URL}/api/internal/premium/jobs/claim")"
          if [ "$status" = '204' ]; then
            echo 'found=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$status" = '200'
          jq --exit-status '.job' claim.json > premium-job.json
          jq --raw-output '.bridgeToken' premium-job.json | sed 's/^/::add-mask::/'
          echo 'found=true' >> "$GITHUB_OUTPUT"
          echo "id=$(jq --raw-output '.id' premium-job.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.claim.outputs.found == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.claim.outputs.found == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Export frozen project
        if: steps.claim.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(jq --raw-output '.sourceCommit' premium-job.json)"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${source_commit}^{commit}"
          source_root="${RUNNER_TEMP}/eixu-premium-source"
          git worktree add --detach "$source_root" "$source_commit"
          npm ci --ignore-scripts
          node scripts/premium/export-project.mjs \
            --input "$GITHUB_WORKSPACE/premium-job.json" \
            --source-root "$source_root" \
            --output-root "$GITHUB_WORKSPACE"
          npm install --package-lock-only --ignore-scripts

      - name: Validate generated app
        if: steps.claim.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          workspace="@eixu/premium-$(jq --raw-output '.projectKey' premium-job.json)"
          npm ci --ignore-scripts
          npm run typecheck --workspace "$workspace"
          npm run lint --workspace "$workspace"
          npm run build --workspace "$workspace"
          npm run premium:validate

      - name: Prepare isolated Vercel project
        if: steps.claim.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          directory="$(jq --raw-output '.directory' premium-job.json)"
          project="$(jq --raw-output '.vercelProjectName' premium-job.json)"
          bridge_token="$(jq --raw-output '.bridgeToken' premium-job.json)"
          if ! npx vercel project inspect "$project" --scope "$VERCEL_TEAM" --token "$VERCEL_TOKEN" >/dev/null 2>&1; then
            npx vercel project add "$project" --scope "$VERCEL_TEAM" --token "$VERCEL_TOKEN"
          fi
          npx vercel link --yes --team "$VERCEL_TEAM" --project "$project" --cwd "$directory" --token "$VERCEL_TOKEN"
          npx vercel env add EIXU_PREMIUM_TOKEN production --force --sensitive --yes \
            --value "$bridge_token" --cwd "$directory" --scope "$VERCEL_TEAM" --token "$VERCEL_TOKEN"
          npx vercel env add EIXU_PLATFORM_URL production --force --yes \
            --value "$EIXU_URL" --cwd "$directory" --scope "$VERCEL_TEAM" --token "$VERCEL_TOKEN"

      - name: Open conversion pull request
        if: steps.claim.outputs.found == 'true'
        id: pull
        shell: bash
        run: |
          set -euo pipefail
          key="$(jq --raw-output '.projectKey' premium-job.json)"
          short="$(jq --raw-output '.id' premium-job.json | cut -c1-8)"
          branch="codex/premium-${key}-${short}"
          git config user.name 'eixu-premium-bot'
          git config user.email 'premium-bot@eixu.com.br'
          git switch -c "$branch"
          git add "$(jq --raw-output '.directory' premium-job.json)" package.json package-lock.json
          git commit -m "feat(premium): converte ${key}"
          git push --set-upstream origin "$branch"
          pr_url="$(gh pr create --base main --head "$branch" \
            --title "feat(premium): converte ${key}" \
            --body "Converte o snapshot publicado de **${key}** em uma aplicação Premium própria. O release validado preserva a URL canônica e bloqueia o gerador depois da ativação. Ao aprovar e fazer merge, o workflow de release publica o projeto e transfere a URL original automaticamente.")"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Record exported conversion
        if: steps.claim.outputs.found == 'true' && steps.pull.outputs.url != ''
        shell: bash
        run: |
          set -euo pipefail
          jq --null-input \
            --arg branch '${{ steps.pull.outputs.branch }}' \
            --arg url '${{ steps.pull.outputs.url }}' \
            '{status:"exported", branch:$branch, pullRequestUrl:$url}' > callback.json
          curl --fail --silent --show-error \
            --request PATCH \
            --header "authorization: Bearer ${PREMIUM_WORKER_TOKEN}" \
            --header 'content-type: application/json' \
            --data @callback.json \
            "${EIXU_URL}/api/internal/premium/jobs/${{ steps.claim.outputs.id }}"

      - name: Record conversion failure
        if: failure() && steps.claim.outputs.found == 'true'
        shell: bash
        run: |
          jq --null-input '{status:"failed", error:"O workflow de conversão falhou. Consulte a execução no GitHub Actions."}' > failure.json
          curl --silent --show-error \
            --request PATCH \
            --header "authorization: Bearer ${PREMIUM_WORKER_TOKEN}" \
            --header 'content-type: application/json' \
            --data @failure.json \
            "${EIXU_URL}/api/internal/premium/jobs/${{ steps.claim.outputs.id }}" || true
